[build-system]
requires = ["hatchling>=1.27", "hatch-nodejs-version>=0.3.2", "jupyter-builder>=1.2.0,<2"]
build-backend = "hatchling.build"

[project]
name = "jupyterlab_ipe_midnight_theme"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.10"
classifiers = [
    "Framework :: Jupyter",
    "Framework :: Jupyter :: JupyterLab",
    "Framework :: Jupyter :: JupyterLab :: 4",
    "Framework :: Jupyter :: JupyterLab :: Extensions",
    "Framework :: Jupyter :: JupyterLab :: Extensions :: Prebuilt",
    "Framework :: Jupyter :: JupyterLab :: Extensions :: Themes",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = []
dynamic = ["version", "description", "authors", "urls", "keywords"]

[project.optional-dependencies]
dev = ["jupyterlab>=4.5,<5", "jupyter-builder>=1.2.0,<2", "pytest>=8", "ruff>=0.8", "codespell>=2.3"]

[project.entry-points."ipython.themes"]
ipe-midnight = "jupyterlab_ipe_midnight_theme:terminal_themes"
ipe-midnight-soft = "jupyterlab_ipe_midnight_theme:terminal_themes"
ipe-midnight-cold = "jupyterlab_ipe_midnight_theme:terminal_themes"

[project.entry-points."pygments.styles"]
ipe-midnight = "jupyterlab_ipe_midnight_theme.terminal:IpeMidnightStyle"
ipe-midnight-soft = "jupyterlab_ipe_midnight_theme.terminal:IpeMidnightSoftStyle"
ipe-midnight-cold = "jupyterlab_ipe_midnight_theme.terminal:IpeMidnightColdStyle"

[tool.hatch.version]
source = "nodejs"

[tool.hatch.metadata.hooks.nodejs]
fields = ["description", "authors", "urls", "keywords"]

[tool.hatch.build.targets.sdist]
artifacts = ["jupyterlab_ipe_midnight_theme/labextension"]
exclude = [".github", ".assets"]

[tool.hatch.build.targets.wheel.shared-data]
"jupyterlab_ipe_midnight_theme/labextension" = "share/jupyter/labextensions/jupyterlab_ipe_midnight_theme"
"install.json" = "share/jupyter/labextensions/jupyterlab_ipe_midnight_theme/install.json"

[tool.hatch.build.hooks.version]
path = "jupyterlab_ipe_midnight_theme/_version.py"

[tool.hatch.build.hooks.jupyter-builder]
dependencies = ["hatch-jupyter-builder>=0.5"]
build-function = "hatch_jupyter_builder.npm_builder"
ensured-targets = [
    "jupyterlab_ipe_midnight_theme/labextension/package.json",
    "jupyterlab_ipe_midnight_theme/labextension/themes/jupyterlab_ipe_midnight_theme/index.css",
]
skip-if-exists = ["jupyterlab_ipe_midnight_theme/labextension/static/style.js"]

[tool.hatch.build.hooks.jupyter-builder.build-kwargs]
build_cmd = "build:prod"
npm = ["jlpm"]

[tool.hatch.build.hooks.jupyter-builder.editable-build-kwargs]
build_cmd = "install:extension"
npm = ["jlpm"]
source_dir = "src"
build_dir = "jupyterlab_ipe_midnight_theme/labextension"

[tool.jupyter-releaser.options]
version_cmd = "hatch version"

[tool.jupyter-releaser.hooks]
before-build-npm = [
    "python -m pip install 'jupyter-builder>=1.2.0,<2'",
    "jlpm",
    "jlpm build:prod",
]
before-build-python = ["jlpm clean:all"]

[tool.check-wheel-contents]
ignore = ["W002"]

[tool.codespell]
skip = "yarn.lock,.assets,.git,node_modules,lib,labextension,tsconfig.tsbuildinfo"

[tool.pytest.ini_options]
testpaths = ["tests", "jupyterlab_ipe_midnight_theme"]
addopts = "--doctest-modules --import-mode=importlib"
pythonpath = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["node_modules", "jupyterlab_ipe_midnight_theme/labextension"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "D", "PTH", "RUF"]
ignore = ["D203", "D212", "D413"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"
